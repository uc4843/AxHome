      - name: Copy HolismPanel/Properties to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismPanel/Properties /HolismPanel/Properties

      - name: Get HolismPanel/Seo
        uses: actions/checkout@v3
        with:
          repository: HolismPanel/Seo
          token: ${{ secrets.PAT }}
          path: HolismPanel/Seo
      - name: Copy HolismPanel/Seo to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismPanel/Seo /HolismPanel/Seo

      - name: Get HolismPanel/Social
        uses: actions/checkout@v3
        with:
          repository: HolismPanel/Social
          token: ${{ secrets.PAT }}
          path: HolismPanel/Social
      - name: Copy HolismPanel/Social to root
        run: |
