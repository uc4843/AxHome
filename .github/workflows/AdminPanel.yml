        run: |
          cp -r $GITHUB_WORKSPACE/HolismPanel/Units /HolismPanel/Units

      # Main
      
      - name: Get Holizm/AxHome
        uses: actions/checkout@v3
        with:
          repository: Holizm/AxHome
          token: ${{ secrets.PAT }}
          path: Holizm/AxHome
      - name: Copy Holizm/AxHome to root
        run: |
          cp -r $GITHUB_WORKSPACE/Holizm/AxHome /Holizm/AxHome

      - name: Move /Holizm/AxHome to /AxHome
        run: |
          sudo cp -a /Holizm/AxHome/. /AxHome
          ls /AxHome -lah
      
      - name: Build production docker
        run: |
          cd /AxHome/AdminPanel
          /HolismHolding/Commands/Build

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push the image
        run: |
          docker push ghcr.io/holizm/axhome/adminpanel:latest

      - name: Logout from GitHub Container Registry
        run: |
          docker logout
