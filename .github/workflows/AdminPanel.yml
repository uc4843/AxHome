      - name: Copy HolismPanel/Forms to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismPanel/Forms /HolismPanel/Forms

      - name: Get HolismPanel/Geo
        uses: actions/checkout@v3
        with:
          repository: HolismPanel/Geo
          token: ${{ secrets.PAT }}
          path: HolismPanel/Geo
      - name: Copy HolismPanel/Geo to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismPanel/Geo /HolismPanel/Geo

      - name: Get HolismPanel/Globalization
        uses: actions/checkout@v3
        with:
