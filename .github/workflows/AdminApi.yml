        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Attributes /HolismApi/Attributes

      - name: Get HolismApi/Blog
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Blog
          token: ${{ secrets.PAT }}
          path: HolismApi/Blog
      - name: Copy HolismApi/Blog to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Blog /HolismApi/Blog

      - name: Get HolismApi/Commissions
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Commissions
          token: ${{ secrets.PAT }}
          path: HolismApi/Commissions
      - name: Copy HolismApi/Commissions to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Commissions /HolismApi/Commissions

      - name: Get HolismApi/Configuration
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Configuration
          token: ${{ secrets.PAT }}
          path: HolismApi/Configuration
      - name: Copy HolismApi/Configuration to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Configuration /HolismApi/Configuration

      - name: Get HolismApi/Contacts
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Contacts
          token: ${{ secrets.PAT }}
          path: HolismApi/Contacts
      - name: Copy HolismApi/Contacts to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Contacts /HolismApi/Contacts

      - name: Get HolismApi/Contents
        uses: actions/checkout@v3
        with:
