name: AdminApi

on:
  # schedule:
  #   - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  buildAndPush:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:

      # Base

      - name: Add commands directory to PATH
        run: |
          echo "/HolismHolding/Commands" >> $GITHUB_PATH

      - name: Create /HolismHolding directory
        run: |
          sudo mkdir /HolismHolding
          sudo chmod 777 --preserve-root /HolismHolding

      - name: Create /HolismApi directory
        run: |
          sudo mkdir /HolismApi
          sudo chmod 777 --preserve-root /HolismApi

      - name: Create /Holizm directory
        run: |
          sudo mkdir /Holizm
          sudo chmod 777 --preserve-root /Holizm

      - name: Get HolismHolding/Infra
        uses: actions/checkout@v3
        with:
          repository: HolismHolding/Infra
          token: ${{ secrets.PAT }}
          path: HolismHolding/Infra
      - name: Copy HolismHolding/Infra to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismHolding/Infra /HolismHolding/Infra

      - name: Get HolismHolding/Commands
        uses: actions/checkout@v3
        with:
          repository: HolismHolding/Commands
          token: ${{ secrets.PAT }}
          path: HolismHolding/Commands
      - name: Copy HolismHolding/Commands to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismHolding/Commands /HolismHolding/Commands

      - name: Get HolismHolding/Scripts
        uses: actions/checkout@v3
        with:
          repository: HolismHolding/Scripts
          token: ${{ secrets.PAT }}
          path: HolismHolding/Scripts
      - name: Copy HolismHolding/Scripts to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismHolding/Scripts /HolismHolding/Scripts

      - name: Get HolismHolding/Docker
        uses: actions/checkout@v3
        with:
          repository: HolismHolding/Docker
          token: ${{ secrets.PAT }}
          path: HolismHolding/Docker
      - name: Copy HolismHolding/Docker to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismHolding/Docker /HolismHolding/Docker

      - name: Get HolismHolding/Fonts
        uses: actions/checkout@v3
        with:
          repository: HolismHolding/Fonts
          token: ${{ secrets.PAT }}
          path: HolismHolding/Fonts
      - name: Copy HolismHolding/Fonts to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismHolding/Fonts /HolismHolding/Fonts

      - name: Get HolismApi/Infra
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Infra
          token: ${{ secrets.PAT }}
          path: HolismApi/Infra
      - name: Copy HolismApi/Infra to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Infra /HolismApi/Infra

      - name: Get HolismApi/Cloud
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Cloud
          token: ${{ secrets.PAT }}
          path: HolismApi/Cloud
      - name: Copy HolismApi/Cloud to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Cloud /HolismApi/Cloud

      - name: Create /AxHome directory
        run: |
          sudo mkdir /AxHome
          sudo chmod 777 --preserve-root /AxHome

      - name: Pull images
        run: |
            docker pull mcr.microsoft.com/dotnet/aspnet:7.0
            docker pull holism/api

      # Dependencies

      - name: Get HolismApi/Accounts
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Accounts
          token: ${{ secrets.PAT }}
          path: HolismApi/Accounts
      - name: Copy HolismApi/Accounts to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Accounts /HolismApi/Accounts

      - name: Get HolismApi/Aggregates
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Aggregates
          token: ${{ secrets.PAT }}
          path: HolismApi/Aggregates
      - name: Copy HolismApi/Aggregates to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Aggregates /HolismApi/Aggregates

      - name: Get HolismApi/Attributes
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Attributes
          token: ${{ secrets.PAT }}
          path: HolismApi/Attributes
