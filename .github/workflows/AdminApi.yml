          path: HolismApi/Contents
      - name: Copy HolismApi/Contents to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Contents /HolismApi/Contents

      - name: Get HolismApi/Contracts
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Contracts
          token: ${{ secrets.PAT }}
          path: HolismApi/Contracts
      - name: Copy HolismApi/Contracts to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Contracts /HolismApi/Contracts

      - name: Get HolismApi/Currencies
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Currencies
