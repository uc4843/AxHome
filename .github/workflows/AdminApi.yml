        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Taxonomy /HolismApi/Taxonomy

      - name: Get HolismApi/Units
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Units
          token: ${{ secrets.PAT }}
          path: HolismApi/Units
      - name: Copy HolismApi/Units to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Units /HolismApi/Units

      # Main
      
      - name: Get Holizm/AxHome
        uses: actions/checkout@v3
        with:
          repository: Holizm/AxHome
          token: ${{ secrets.PAT }}
          path: Holizm/AxHome
      - name: Copy Holizm/AxHome to root
        run: |
          cp -r $GITHUB_WORKSPACE/Holizm/AxHome /Holizm/AxHome

      - name: Move /Holizm/AxHome to /AxHome
        run: |
          sudo cp -a /Holizm/AxHome/. /AxHome
          ls /AxHome -lah
      
      - name: Build production docker
        run: |
          cd /AxHome/AdminApi
          /HolismHolding/Commands/Build

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push the image
        run: |
          docker push ghcr.io/holizm/axhome/adminapi:latest

      - name: Logout from GitHub Container Registry
        run: |
          docker logout
