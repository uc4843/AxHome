      - name: Copy HolismApi/Globalization to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Globalization /HolismApi/Globalization

      - name: Get HolismApi/Media
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Media
          token: ${{ secrets.PAT }}
          path: HolismApi/Media
      - name: Copy HolismApi/Media to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Media /HolismApi/Media

      - name: Get HolismApi/Modules
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Modules
          token: ${{ secrets.PAT }}
          path: HolismApi/Modules
      - name: Copy HolismApi/Modules to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Modules /HolismApi/Modules

      - name: Get HolismApi/Navigation
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Navigation
          token: ${{ secrets.PAT }}
          path: HolismApi/Navigation
      - name: Copy HolismApi/Navigation to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Navigation /HolismApi/Navigation

      - name: Get HolismApi/Pricing
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Pricing
          token: ${{ secrets.PAT }}
          path: HolismApi/Pricing
      - name: Copy HolismApi/Pricing to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Pricing /HolismApi/Pricing

      - name: Get HolismApi/Properties
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Properties
          token: ${{ secrets.PAT }}
          path: HolismApi/Properties
      - name: Copy HolismApi/Properties to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Properties /HolismApi/Properties

      - name: Get HolismApi/Seo
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Seo
          token: ${{ secrets.PAT }}
          path: HolismApi/Seo
      - name: Copy HolismApi/Seo to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Seo /HolismApi/Seo

      - name: Get HolismApi/Social
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Social
          token: ${{ secrets.PAT }}
          path: HolismApi/Social
      - name: Copy HolismApi/Social to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Social /HolismApi/Social

      - name: Get HolismApi/Taxonomy
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Taxonomy
          token: ${{ secrets.PAT }}
          path: HolismApi/Taxonomy
