      - name: Get HolismApi/Forms
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Forms
          token: ${{ secrets.PAT }}
          path: HolismApi/Forms
      - name: Copy HolismApi/Forms to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Forms /HolismApi/Forms

      - name: Get HolismApi/Geo
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Geo
          token: ${{ secrets.PAT }}
          path: HolismApi/Geo
      - name: Copy HolismApi/Geo to root
        run: |
          cp -r $GITHUB_WORKSPACE/HolismApi/Geo /HolismApi/Geo

      - name: Get HolismApi/Globalization
        uses: actions/checkout@v3
        with:
          repository: HolismApi/Globalization
          token: ${{ secrets.PAT }}
